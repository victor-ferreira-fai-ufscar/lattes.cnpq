# Ajustes deste projeto sobre a stack oficial (docker-compose.yml, vendorizada
# sem edições — ver .upstream-commit). Carregado via COMPOSE_FILE no .env.
#
# Só o caminho de storage sobe: `sh run.sh up` ou o Makefile da raiz nomeiam
# db/rest/storage explicitamente, e o resto (kong, studio, auth, realtime,
# functions, meta, supavisor) nunca é iniciado. Motivos:
#   - o app usa Supabase apenas como object storage (nem banco nem auth);
#   - a porta 8000 do kong já é do chatbot FAI nesta máquina;
#   - o Caddy central (/srv/docker/caddy) faz o roteamento /storage/v1/* que
#     seria a única função do kong aqui;
#   - a máquina vive perto do limite de RAM — cada container evitado conta.
services:
  storage:
    # Publicado só no loopback: quem expõe pra internet é o Caddy central,
    # em https://lattes-storage.sup.fai.ufscar.br.
    ports:
      - "127.0.0.1:5100:5000"
    environment:
      # Só trafegam PDF/DOCX/JSON/HTML/CSV/ZIP — imgproxy nunca é chamado.
      ENABLE_IMAGE_TRANSFORMATION: "false"
      # ZIP consolidado de lote passa fácil dos 50MB do padrão upstream.
      FILE_SIZE_LIMIT: 209715200
