# Bloco para /srv/docker/caddy/Caddyfile (fora deste repo).
# Versionado aqui só como referência do que a infra precisa ter.
# Aplicar logo depois do bloco lattes-api.sup.fai.ufscar.br e recarregar:
#
#   docker exec caddy caddy validate --config /etc/caddy/Caddyfile
#   docker exec caddy caddy reload   --config /etc/caddy/Caddyfile

# Supabase self-hosted (storage-api em 127.0.0.1:5100, ver supabase/docker deste repo).
# Guarda só os arquivos dos currículos: sem banco de aplicação, sem auth.
# handle_path remove o prefixo /storage/v1 — é o que o kong faria (strip_path: true
# na rota storage-v1 do kong.yml). O kong não sobe aqui: a porta 8000 é do chatbot
# e ele arrastaria o studio junto, então este bloco é o gateway.
# O storage-api valida o JWT service_role sozinho; /object/public/* é aberto,
# igual ao bucket público que existia na nuvem.
# Precisa ser HTTPS público: os download_url que a API devolve são montados como
# {SUPABASE_URL}/storage/v1/object/public/... e viram <a href> no navegador.
lattes-storage.sup.fai.ufscar.br {
	import suptls
	handle_path /storage/v1/* {
		reverse_proxy localhost:5100
	}
}
